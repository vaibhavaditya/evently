spring.application.name=evt-bff
server.port=8082
event.open-service.url=${EVENT_OPEN_SERVICE_URL:http://localhost:8081}

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

jwt.secret=${JWT_SECRET:replace-with-a-long-random-secret-for-local-development-only}
logging.structured.format.console=logstash
logging.structured.json.add.service=evt-bff