services:

  postgres:
    image: postgres:16
    container_name: evently-postgres

    environment:
      POSTGRES_DB: evently
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d evently"]
      interval: 10s
      timeout: 5s
      retries: 5


  mongo:
    image: mongo:7
    container_name: evently-mongo

    ports:
      - "27017:27017"

    volumes:
      - mongo_data:/data/db

    healthcheck:
      test:
        ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5


  redis:
    image: redis:7
    container_name: evently-redis

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5


  kafka:
    image: apache/kafka:3.9.0
    container_name: evently-kafka

    ports:
      - "9092:9092"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: >
        CONTROLLER:PLAINTEXT,
        PLAINTEXT:PLAINTEXT

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"
        ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s


  # =========================
  # CORE SERVICE
  # =========================

  evt-core-service:
    build:
      context: .
      dockerfile: evt-core-service/Dockerfile

    container_name: evently-core-service

    ports:
      - "9090:9090"

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/evently
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres

    depends_on:
      postgres:
        condition: service_healthy


  # =========================
  # OPEN SERVICE
  # =========================

  evt-open-service:
    build:
      context: .
      dockerfile: evt-open-service/Dockerfile

    container_name: evently-open-service

    ports:
      - "8081:8081"

    environment:
      EVENT_CORE_GRPC_HOST: evt-core-service
      EVENT_CORE_GRPC_PORT: 9090

    depends_on:
      evt-core-service:
        condition: service_started


  # =========================
  # BFF
  # =========================

  evt-bff:
    build:
      context: .
      dockerfile: evt-bff/Dockerfile

    container_name: evently-bff

    ports:
      - "8082:8082"

    environment:
      EVENT_OPEN_SERVICE_URL: http://evt-open-service:8081

    depends_on:
      evt-open-service:
        condition: service_started


volumes:
  postgres_data:
  mongo_data:
  redis_data: